[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-csv-cleanup-toolkit"
version = "0.1.0"
description = "Clean, validate, and report on messy CSV/Excel files."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cleanup-tool = "cleanup_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
